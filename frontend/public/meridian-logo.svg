<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- 3D Sphere -->
  <circle cx="200" cy="150" r="80" fill="url(#sphereGradient)" stroke="#0A1F44" stroke-width="6"/>

  <!-- Gradient for 3D effect -->
  <defs>
    <radialGradient id="sphereGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#C5A200"/>
      <stop offset="100%" stop-color="#0A1F44"/>
    </radialGradient>
  </defs>

  <!-- Shield inside sphere -->
  <path d="M200 110 L180 140 L180 170 L200 190 L220 170 L220 140 Z" fill="#FFFFFF" stroke="#0A1F44" stroke-width="4"/>

  <!-- Meridian lines -->
  <line x1="120" y1="150" x2="280" y2="150" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="70" x2="200" y2="230" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <!-- Text -->
  <text x="50%" y="300" font-family="Montserrat, sans-serif" font-size="28" font-weight="bold" fill="#0A1F44" text-anchor="middle">
    MERIDIAN
  </text>
  <text x="50%" y="330" font-family="Montserrat, sans-serif" font-size="18" fill="#0A1F44" text-anchor="middle">
    FOUNDATION
  </text>
</svg>
